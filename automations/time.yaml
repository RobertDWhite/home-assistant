# Scheduled reminders.
# Speakers fixed 2026-09-15: media_player.living_room_speaker is actually the Upstairs Bathroom
# Sonos and media_player.office_sonos no longer exists, so the reminder was only playing in the
# upstairs bathroom.

- id: garbage_collection_reminder
  alias: Garbage Collection Reminder
  description: Monday 9pm reminder on the Great Room and Office Sonos plus a phone notification.
  mode: single
  triggers:
    - trigger: time
      at: "21:00:00"
  conditions:
    - condition: time
      weekday:
        - mon
  variables:
    message: "Good evening. Did you remember to take the trash out to the road? Don't forget to take the trash out to the road before you go to bed this evening. Have a great night."
  actions:
    - parallel:
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.family_room
            volume: 0.6
            message: "{{ message }}"
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.unnamed_room
            volume: 0.6
            message: "{{ message }}"
        - action: notify.mobile_app_iphone_robert
          continue_on_error: true
          data:
            title: Trash night
            message: Take the trash out to the road before bed.
