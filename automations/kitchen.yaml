# Kitchen (Samsung refrigerator via SmartThings).
# The fridge door sensor changed ~470 times last week; nothing watches for it being left open.

- id: kitchen_fridge_door_left_open
  alias: Kitchen - fridge or freezer door left open
  description: Announce in the kitchen and notify when a fridge/freezer door has been open 3 minutes, and again at 10.
  mode: parallel
  max: 4
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.refrigerator_fridge_door
        - binary_sensor.refrigerator_freezer_door
        - binary_sensor.refrigerator_coolselect_door
      to: "on"
      for:
        minutes: 3
      id: three
    - trigger: state
      entity_id:
        - binary_sensor.refrigerator_fridge_door
        - binary_sensor.refrigerator_freezer_door
        - binary_sensor.refrigerator_coolselect_door
      to: "on"
      for:
        minutes: 10
      id: ten
  variables:
    door: "{{ trigger.to_state.name | replace('Refrigerator ', '') }}"
    minutes: "{{ 3 if trigger.id == 'three' else 10 }}"
    message: "The {{ door | lower }} has been open for {{ minutes }} minutes."
  actions:
    - parallel:
        - parallel:
            - action: script.turn_on
              continue_on_error: true
              target:
                entity_id: script.matrix_homeassistant_alert
              data:
                variables:
                  title: Refrigerator
                  message: '{{ message }}'
            - action: notify.mobile_app_iphone_robert
              continue_on_error: true
              data:
                title: Refrigerator
                message: "{{ message }}"
        - sequence:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.kitchen
              data:
                volume_level: 0.5
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.kitchen
                message: "{{ message }}"
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.family_room
            volume: 0.4
            message: "{{ message }}"

- id: kitchen_water_filter_reminder
  alias: Kitchen - fridge water filter reminder
  description: Sunday-morning phone reminder while the refrigerator reports its water filter at 100% used.
  mode: single
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - condition: time
      weekday:
        - sun
    - condition: numeric_state
      entity_id: sensor.refrigerator_water_filter_usage
      above: 99
  actions:
    - parallel:
        - action: script.turn_on
          continue_on_error: true
          target:
            entity_id: script.matrix_homeassistant_alert
          data:
            variables:
              title: Refrigerator
              message: The water filter is at 100% usage. Replace it, then press "Reset water filter" in Home Assistant.
        - action: notify.mobile_app_iphone_robert
          data:
            title: Refrigerator
            message: The water filter is at 100% usage. Replace it, then press "Reset water filter" in Home Assistant.

- id: kitchen_lights_off_no_motion
  alias: Kitchen - lights off after 10 min with no motion
  description: >-
    Turns the Hue kitchen lights off when the Kitchen MotionAware area (binary_sensor.kitchen_kitchen_area,
    Hue lights used as motion sensors) has seen no motion for 10 minutes. Off only: motion never turns
    the kitchen on (the Hue app's on-with-motion routine for this area was deleted 2026-10-11).
    The Lutron under-cabinet lights follow via kitchen_undercabinet_follows_hue in lighting.yaml.
    Does nothing while the motion area is unknown/unavailable.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_kitchen_area
      to: "off"
      for:
        minutes: 10
    - alias: Lights turned on (app, Siri) while nobody is moving in the kitchen
      trigger: state
      entity_id: light.kitchen_2
      to: "on"
      for:
        minutes: 10
  conditions:
    - alias: No motion for 10 minutes (and the motion area is actually reporting)
      condition: state
      entity_id: binary_sensor.kitchen_kitchen_area
      state: "off"
      for:
        minutes: 10
    - condition: state
      entity_id: light.kitchen_2
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.kitchen_2
      data:
        transition: 5
