# Default Home Assistant theme: Frosted Glass Dark (themes/frosted_glass_dark.yaml) for both the light
# and dark frontend modes. Re-applied at startup. (Replaced the old sun-based Navy Blue / slate switch.)

- alias: 'Set HA theme for day and night'
  trigger:
    - platform: homeassistant
      event: start
  action:
    - service: frontend.set_theme
      data:
        name: Frosted Glass Dark
        mode: light
    - service: frontend.set_theme
      data:
        name: Frosted Glass Dark
        mode: dark

