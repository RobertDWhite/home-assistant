- id: laundry_lights_left_on
  alias: Laundry - lights left on overnight
  description: The Lutron laundry-room switch gets left on; turn it off at 01:00 if it has been on for an hour.
  mode: single
  triggers:
    - trigger: time
      at: "01:00:00"
  conditions:
    - condition: state
      entity_id: light.laundry_main_lights
      state: "on"
      for:
        hours: 1
  actions:
    - action: light.turn_off
      target:
        entity_id: light.laundry_main_lights
