# Master bath screen: show the morning/evening dashboard stream on the Roku when someone is in
# the master bath during the morning or evening window, and take it down after 15 quiet minutes.
# Layout switches itself at 2 PM (sensor.bath_screen_mode). See scripts/bath_screen.yaml.

- id: bath_screen_auto
  alias: Bath screen - show in the morning and evening
  mode: queued
  max: 3
  triggers:
    - trigger: motion.detected
      target:
        entity_id: binary_sensor.master_bathroom_master_bathroom_motionaware_area_mb
      id: show
    - trigger: motion.cleared
      target:
        entity_id: binary_sensor.master_bathroom_master_bathroom_motionaware_area_mb
      options:
        for: "00:15:00"
      id: hide
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: show
            - condition: or
              conditions:
                - condition: time
                  after: "05:00:00"
                  before: "10:00:00"
                - condition: time
                  after: "18:30:00"
                  before: "23:30:00"
            # Don't interrupt something already playing (including the stream itself).
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.master_bath_roku
                  state:
                    - playing
                    - paused
                    - buffering
          sequence:
            - action: script.bath_screen_show
        - conditions:
            - condition: trigger
              id: hide
          sequence:
            - action: script.bath_screen_hide
