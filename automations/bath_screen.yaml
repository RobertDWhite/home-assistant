# First bathroom light on starts the TV at any hour; last light off stops it.
# Retain scheduled starts at 08:30/22:30 and stops at 09:30/midnight.
- id: bath_screen_auto
  alias: Bath screen - lights and schedule
  mode: restart
  triggers:
  - trigger: time
    at:
    - 08:30:00
    - '22:30:00'
    id: start
  - trigger: light.turned_on
    target: &id001
      entity_id:
      - light.master_bathroom
      - light.master_bath_main_lights
      - light.master_bath_vanity_lights
      - light.master_bath_shower_lights
    options:
      behavior: first
    id: start
  - trigger: time
    at:
    - 09:30:00
    - 00:00:00
    id: stop
  - trigger: light.turned_off
    target: *id001
    options:
      behavior: all
    id: stop
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: start
      sequence:
      - action: script.bath_screen_show
    - conditions:
      - condition: trigger
        id: stop
      sequence:
      - action: script.bath_screen_hide
