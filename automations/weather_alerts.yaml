# Get weather alerts from NWS and supply TTS devices with information to verbally alert.
#
# Hardened 2026-09-15: sensor.nws_alert_count flips to "unavailable" whenever api.weather.gov
# is unreachable (about half of its state changes), which used to fire the popup script ~1,000
# times a week and crash the announcement with "None has no element 0". Both automations now
# ignore unavailable/unknown transitions; the announcement fires only for alert ids it has not seen.
#
# Only Tornado Watch/Warning, Severe Thunderstorm Warning and Blizzard Warning raise alarms (list in
# custom_templates/nws_alerts.jinja). Other alerts, e.g. Special Weather Statements, stay on the dashboard.

- id: nws_weather_alert_popup_control
  alias: NWS Weather Alert Pop Up Control
  mode: queued
  triggers:
    - trigger: state
      entity_id: sensor.nws_alert_count
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown
  actions:
    - action: script.nws_popup_on_wx_alert

- id: nws_announcement_weather_alert
  alias: NWS Announcement Weather Alert
  mode: queued
  triggers:
    - trigger: state
      entity_id: sensor.nws_alert_event
      not_from:
        - unavailable
        - unknown
      not_to:
        - unavailable
        - unknown
  variables:
    new_alarms: >-
      {% from 'nws_alerts.jinja' import alarm_features %}
      {% set old_ids = (trigger.from_state.attributes.features | default([], true)) | map(attribute='id') | list %}
      {{ alarm_features(trigger.to_state.attributes.features) | from_json | rejectattr('id', 'in', old_ids) | list }}
    event: "{{ new_alarms[0].properties.event if new_alarms else '' }}"
    expires: >-
      {% set e = new_alarms[0].properties.expires if new_alarms else none %}
      {{ (as_timestamp(e) | timestamp_custom('%-I:%M %p on %-m-%-d-%Y')) if e else 'later today' }}
    alert_message: >-
      Attention!. . . Attention!. . . The National Weather Service has issued a
      {{ event }} for Butler County. It expires at {{ expires }}.
  conditions:
    - alias: A new alarm-worthy alert was issued
      condition: template
      value_template: "{{ new_alarms | count > 0 }}"
    ## Quiet hours 9pm–8:30am: only Tornado Warnings are allowed to announce
    - condition: or
      conditions:
        - condition: time
          after: "08:30:00"
          before: "21:00:00"
        - condition: template
          value_template: "{{ event == 'Tornado Warning' }}"
  actions:
    # Sonos speakers - announce overlay via sonos_say script
    - action: script.sonos_say
      continue_on_error: true
      data:
        sonos_entity: media_player.family_room
        volume: 0.50
        message: "{{ alert_message }}"
    - action: script.sonos_say
      continue_on_error: true
      data:
        sonos_entity: media_player.dining_room
        volume: 0.50
        message: "{{ alert_message }}"
    - action: script.sonos_say
      continue_on_error: true
      data:
        sonos_entity: media_player.unnamed_room
        volume: 0.50
        message: "{{ alert_message }}"
    - action: script.sonos_say
      continue_on_error: true
      data:
        sonos_entity: media_player.unnamed_room_2
        volume: 0.50
        message: "{{ alert_message }}"
    # HomePod Minis - Google TTS
    - action: media_player.volume_set
      continue_on_error: true
      data:
        entity_id:
          - media_player.kitchen
          - media_player.play_room
        volume_level: 0.50
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.kitchen
        message: "{{ alert_message }}"
    - delay: "00:00:10"
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.play_room
        message: "{{ alert_message }}"
    # WiiM speakers (LinkPlay integration) - Google TTS
    - action: media_player.volume_set
      continue_on_error: true
      data:
        entity_id:
          - media_player.garage_2
          - media_player.gym_2
        volume_level: 0.50
    - action: media_player.volume_set
      continue_on_error: true
      data:
        entity_id: media_player.backyard_2
        volume_level: 0.99
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.garage_2
        message: "{{ alert_message }}"
    - delay: "00:00:10"
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.backyard_2
        message: "{{ alert_message }}"
    - delay: "00:00:10"
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.gym_2
        message: "{{ alert_message }}"
    # Denon AVR - Theatre
    - delay: "00:00:10"
    - action: media_player.volume_set
      continue_on_error: true
      data:
        entity_id: media_player.denon_avr_x4700h
        volume_level: 0.50
    - action: tts.google_translate_say
      continue_on_error: true
      data:
        entity_id: media_player.denon_avr_x4700h
        message: "{{ alert_message }}"
    # Phone
    - action: notify.mobile_app_iphone_robert
      continue_on_error: true
      data:
        title: "NWS: {{ event }}"
        message: "Expires {{ expires }}."
