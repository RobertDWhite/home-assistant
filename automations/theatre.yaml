# Theatre "movie mode": tie the Hue theatre lights + circadian to the Denon AVR power.
- id: theatre_movie_mode
  alias: Theatre - movie mode
  description: >-
    When the Theatre Denon AVR powers on, disable the theatre circadian switches and set the Hue theatre,
    bar and Music / Play lights to a dim cinema red. When the AVR powers off, restore a normal level, then re-enable circadian 10 s later.
    2026-10-11: the AVR drops to "unavailable" and back several times a week (03:33, 00:44 ...). The old
    triggers (from: off / to: off) treated off->unavailable as "start" and unavailable->off as "end", and the
    end branch turns the lights ON at 55%, so the basement lit up overnight and stayed on 20+ hours. Now:
    start needs a real off->on that holds 20 s (ignores HDMI-CEC blips), and end only runs when movie mode
    is actually active (theatre circadian switched off by the start branch).
  mode: restart
  triggers:
    - trigger: state
      entity_id: media_player.denon_avr_x4700h
      from: "off"
      to: ["on", playing, paused, idle]
      for:
        seconds: 20
      id: start
    - trigger: state
      entity_id: media_player.denon_avr_x4700h
      from: ["on", playing, paused, idle]
      to: "off"
      id: end
  actions:
    - choose:
        - conditions: [{condition: trigger, id: start}]
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.circadian_lighting_circadian_theatre
                  - switch.circadian_lighting_circadian_theatre_accent
                  - switch.circadian_lighting_circadian_theatre_rear
                  - switch.circadian_lighting_circadian_theatre_hall
                  # Basement landing (bottom of the stairs) is in the Theatre Hue group but is driven
                  # by the Basement Staircase circadian switch, which would repaint it bright white.
                  - switch.circadian_lighting_circadian_basement_staircase
                  - switch.circadian_lighting_circadian_bar
                  - switch.circadian_lighting_circadian_music_and_play
            - action: light.turn_on
              target:
                entity_id:
                  - light.theatre
                  - light.bar   # basement bar joins the red scene
                  - light.music_play   # so does the Music / Play room
                  - light.basement_accent   # accent spot + fireplace join the red scene too
              data:
                brightness_pct: 8
                # Deep cinema red: aisle/step-light colour, keeps eyes dark-adapted and spills the
                # least onto the screen (blue scatters and reads as "standby"). Tweak to taste.
                rgb_color: [255, 30, 0]
        - conditions:
            - condition: trigger
              id: end
            - alias: Movie mode is actually active (the start branch turned theatre circadian off)
              condition: state
              entity_id: switch.circadian_lighting_circadian_theatre
              state: "off"
          sequence:
            # Bring the room back first, then hand control back to circadian 10 s later so
            # the two don't fight over the same bulbs in the same instant.
            - action: light.turn_on
              target:
                entity_id:
                  - light.theatre
                  - light.bar   # basement bar joins the red scene
                  - light.music_play
              data:
                color_temp_kelvin: 2900
                brightness_pct: 55
            - action: script.basement_accents_color
            - delay:
                seconds: 10
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.circadian_lighting_circadian_theatre
                  # theatre_accent circadian stays OFF (basement accents use purple/blue)
                  - switch.circadian_lighting_circadian_theatre_rear
                  - switch.circadian_lighting_circadian_theatre_hall
                  - switch.circadian_lighting_circadian_basement_staircase
                  - switch.circadian_lighting_circadian_bar
                  - switch.circadian_lighting_circadian_music_and_play

- id: theatre_lights_off_no_motion
  alias: Theatre - lights off after 30 min with no motion
  description: >-
    Turns the Hue theatre lights off when the Theatre MotionAware area (binary_sensor.theatre_theatre,
    Hue lights used as motion sensors) has seen no motion for 30 minutes, unless the TV is in use
    (Denon AVR on, or the Theatre Apple TV playing/paused): people sit still during a movie. Also
    catches lights left on in an empty room, and a movie that ended with nobody moving afterwards.
    The downstairs bar and Music / Play lights go off with the theatre.
    Does nothing while the motion area is unknown/unavailable. The basement accents follow the
    theatre lights off via basement_accents_follow_downstairs.
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.theatre_theatre
      to: "off"
      for:
        minutes: 30
    - trigger: state
      entity_id: light.theatre
      to: "on"
      for:
        minutes: 30
    - trigger: state
      entity_id: media_player.denon_avr_x4700h
      to: "off"
      for:
        minutes: 30
    - trigger: state
      entity_id: media_player.theatre_theatre
      to: ["off", idle, standby]
      for:
        minutes: 30
  conditions:
    - alias: No motion for 30 minutes (and the motion area is actually reporting)
      condition: state
      entity_id: binary_sensor.theatre_theatre
      state: "off"
      for:
        minutes: 30
    - alias: TV not in use (Denon AVR off/unavailable)
      condition: not
      conditions:
        - condition: state
          entity_id: media_player.denon_avr_x4700h
          state: ["on", playing, paused, idle]
    - alias: TV not in use (Apple TV not playing)
      condition: not
      conditions:
        - condition: state
          entity_id: media_player.theatre_theatre
          state: [playing, paused]
    - condition: state
      entity_id: light.theatre
      state: "on"
  actions:
    - alias: Theatre, plus the bar and Music / Play lights if they were left on too
      action: light.turn_off
      target:
        entity_id:
          - light.theatre
          - light.bar
          - light.music_play
      data:
        transition: 5

- id: basement_accents_follow_downstairs
  alias: Basement - accent lights follow the theatre/bar lights (purple/blue)
  description: >-
    When the theatre or bar lights come on outside movie mode, the basement accents (accent spot + fireplace
    downlight) turn on in purple/blue (script.basement_accents_color). When the theatre and bar are both off,
    the accents turn off. Movie mode handles the accents itself (red, then purple/blue at the end).
    Also keeps the Circadian Theatre Accent switch off after a restart.
  mode: queued
  max: 5
  triggers:
    - trigger: state
      entity_id: [light.theatre, light.bar]
      from: "off"
      to: "on"
      id: downstairs_on
    - trigger: state
      entity_id: [light.theatre, light.bar]
      from: "on"
      to: "off"
      id: downstairs_off
    - trigger: homeassistant
      event: start
      id: startup
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: downstairs_on
            - alias: Not in movie mode (movie mode switches theatre circadian off)
              condition: state
              entity_id: switch.circadian_lighting_circadian_theatre
              state: "on"
          sequence:
            - action: script.basement_accents_color
        - conditions:
            - condition: trigger
              id: downstairs_off
            - condition: state
              entity_id: [light.theatre, light.bar]
              state: "off"
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.basement_accent
              data:
                transition: 2
        - conditions:
            - condition: trigger
              id: startup
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.circadian_lighting_circadian_theatre_accent
