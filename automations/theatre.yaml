# Theatre "movie mode": tie the Hue theatre lights + circadian to the Denon AVR power.
- id: theatre_movie_mode
  alias: Theatre - movie mode
  description: >-
    When the Theatre Denon AVR powers on, disable the theatre circadian switches and set the Hue theatre
    and bar lights to a dim cinema red. When the AVR powers off, restore a normal level, then re-enable circadian 10 s later.
  mode: restart
  triggers:
    - trigger: state
      entity_id: media_player.denon_avr_x4700h
      from: "off"
      id: start
    - trigger: state
      entity_id: media_player.denon_avr_x4700h
      to: "off"
      id: end
  actions:
    - choose:
        - conditions: [{condition: trigger, id: start}]
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.circadian_lighting_circadian_theatre
                  - switch.circadian_lighting_circadian_theatre_accent
                  - switch.circadian_lighting_circadian_theatre_rear
                  - switch.circadian_lighting_circadian_theatre_hall
                  # Basement landing (bottom of the stairs) is in the Theatre Hue group but is driven
                  # by the Basement Staircase circadian switch, which would repaint it bright white.
                  - switch.circadian_lighting_circadian_basement_staircase
                  - switch.circadian_lighting_circadian_bar
            - action: light.turn_on
              target:
                entity_id:
                  - light.theatre
                  - light.bar   # basement bar joins the red scene
              data:
                brightness_pct: 8
                # Deep cinema red: aisle/step-light colour, keeps eyes dark-adapted and spills the
                # least onto the screen (blue scatters and reads as "standby"). Tweak to taste.
                rgb_color: [255, 30, 0]
        - conditions: [{condition: trigger, id: end}]
          sequence:
            # Bring the room back first, then hand control back to circadian 10 s later so
            # the two don't fight over the same bulbs in the same instant.
            - action: light.turn_on
              target:
                entity_id:
                  - light.theatre
                  - light.bar   # basement bar joins the red scene
              data:
                color_temp_kelvin: 2900
                brightness_pct: 55
            - delay:
                seconds: 10
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.circadian_lighting_circadian_theatre
                  - switch.circadian_lighting_circadian_theatre_accent
                  - switch.circadian_lighting_circadian_theatre_rear
                  - switch.circadian_lighting_circadian_theatre_hall
                  - switch.circadian_lighting_circadian_basement_staircase
                  - switch.circadian_lighting_circadian_bar
