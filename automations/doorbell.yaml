# Doorbell chime through the house speakers.
# The previous version targeted seven media_player entity_ids that no longer exist and a
# /local/doorbell.wav that is not in /config/www, so it never played anything (HA logged
# "Referenced entities ... are missing" on every ring). The UniFi chimes (Main Floor / Basement)
# ring on their own; this adds the Sonos speakers. The recognized-face announcement lives in
# doorbell_face_greeting.yaml and follows a few seconds later.

- id: doorbell_house_chime
  alias: Front door - chime on house speakers
  description: Play the doorbell chime clip on the live Sonos speakers using the announce overlay (music keeps playing).
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event.received
      target:
        entity_id: event.front_door_g4_doorbell_pro_doorbell
      options:
        event_type: ring
  actions:
    - action: media_player.play_media
      continue_on_error: true
      target:
        entity_id:
          - media_player.family_room       # Great Room Sonos
          - media_player.dining_room       # Dining Room Sonos
          - media_player.unnamed_room      # Office Sonos
          - media_player.unnamed_room_2    # Main Bedroom Sonos
          - media_player.living_room_speaker  # Upstairs Bathroom Sonos
      data:
        media_content_id: https://homeassistant.internal.white.fm/local/sounds_sounds_ring_button_Chime.wav
        media_content_type: music
        announce: true
        extra:
          volume: 45
