# Local-AI extras on the Ollama server (qwen3.8:27b): a morning house briefing written by HA Text AI,
# an evening wind-down note, an Ollama Vision description of whatever pulls into the driveway, and a weekly Battery Notes digest.
# Nothing here controls devices; results land on the Overview dashboard (and Matrix for the digest).

- id: house_morning_briefing
  alias: House - morning briefing (local AI)
  description: >-
    06:30 daily. Gathers today's calendar (plus tomorrow morning), flights in the next 48 h, forecast,
    trash day, upcoming anniversaries, low batteries and the sky, and has HA Text AI (sensor.house_briefing) write a short briefing. Shown on the Home view.
  mode: single
  triggers:
    - trigger: time
      at: "06:30:00"
  actions:
    - action: calendar.get_events
      continue_on_error: true
      target:
        entity_id: calendar.skylight_whitehouse_family
      data:
        duration:
          hours: 30
      response_variable: cal
    - action: calendar.get_events
      continue_on_error: true
      target:
        entity_id: calendar.flighty
      data:
        duration:
          hours: 48
      response_variable: flights
    - action: weather.get_forecasts
      continue_on_error: true
      target:
        entity_id: weather.kmwo
      data:
        type: twice_daily
      response_variable: wx
    - variables:
        facts: >-
          {% set all_ev = (cal or {}).get('calendar.skylight_whitehouse_family', {}).get('events', []) %}
          {% set tomorrow = (now() + timedelta(days=1)).date() %}
          {% set ev = all_ev | selectattr('start', 'lt', tomorrow.isoformat()) | list %}
          {% set ev_tmrw = all_ev | selectattr('start', 'ge', tomorrow.isoformat()) | list %}
          {% set fl = (flights or {}).get('calendar.flighty', {}).get('events', []) %}
          {% set fc = (wx or {}).get('weather.kmwo', {}).get('forecast', [])
             | selectattr('datetime', '>=', (now() - timedelta(hours=11)).isoformat()) | list %}
          Today is {{ now().strftime('%A, %B %-d') }}.
          Outside it is {{ states('sensor.thermostat_1_outdoor_temperature') | round(0) }} degrees.
          {% for f in fc[:2] %}{{ 'Today' if f.is_daytime else 'Tonight' }}: {{ f.condition | replace('partlycloudy', 'partly cloudy') | replace('-', ' ') }}, {{ 'high' if f.is_daytime else 'low' }} {{ f.temperature }}, {{ f.precipitation_probability | default(0) }}% chance of rain. {% endfor %}
          {% if ev %}Calendar today: {% for e in ev %}{% set s = as_datetime(e.start) %}{% set all_day = s.strftime('%H:%M') == '00:00' and (as_datetime(e.end) - s).total_seconds() >= 86400 %}{{ e.summary }}{{ ' (all day)' if all_day else ' at ' ~ s.strftime('%-I:%M %p') }}; {% endfor %}{% else %}Nothing on the family calendar today.{% endif %}
          {% for e in ev_tmrw if as_datetime(e.start).hour < 12 and as_datetime(e.start).strftime('%H:%M') != '00:00' %}{{ 'Tomorrow morning: ' if loop.first }}{{ e.summary }} at {{ as_datetime(e.start).strftime('%-I:%M %p') }}; {% endfor %}
          {% for f in fl %}{% set d = as_datetime(f.start) %}Flight {{ 'today' if d.date() == now().date() else 'tomorrow' if d.date() == tomorrow else d.strftime('%A') }} at {{ d.strftime('%-I:%M %p') }}: {{ f.summary | replace('✈', '') | replace('​', '') | trim }}.{% if d.date() == tomorrow and d.hour < 9 %} That is an early departure, so plan an early night tonight and pack ahead.{% endif %} {% endfor %}
          {% set td = states('sensor.trash_pickup') | int(-1) %}{% if td == 0 %}Trash pickup is today.{% elif td == 1 %}Trash goes out tonight.{% endif %}
          {% set soon = states.sensor | selectattr('entity_id', 'match', 'sensor.anniversary_') | rejectattr('entity_id', 'search', '_date$') | selectattr('state', 'is_number') | list %}
          {% for a in soon if a.state | int <= 7 %}{{ a.name }} is in {{ a.state }} days. {% endfor %}
          {% set low = states.sensor | selectattr('entity_id', 'search', '_battery_plus$') | selectattr('attributes.battery_low', 'eq', true) | list %}
          {% if low %}Low batteries: {% for b in low %}{{ b.attributes.device_name }} ({{ b.attributes.battery_type_and_quantity }}){{ ', ' if not loop.last }}{% endfor %}.{% endif %}
          The moon is {{ states('sensor.luna_lunar_phase') | lower }}, {{ states('sensor.luna_lunar_percent_illuminated') | round(0) }}% lit.
          {% if 'OL' not in states('sensor.ups_status_data').split() %}Note: the UPS reports {{ states('sensor.ups_status_data') }}.{% endif %}
    # The Ollama router can answer 504 while a model loads: try up to 3 times, 3 minutes apart.
    - repeat:
        count: 3
        sequence:
          - action: ha_text_ai.ask_question
            continue_on_error: true
            data:
              instance: sensor.house_briefing
              # qwen3.8 ignores the integration's /no_think switch, so leave room to reason before answering
              max_tokens: 1500
              system_prompt: >-
                You write a warm, practical morning briefing for a family's home dashboard. Use only the facts
                given. 3 to 6 short sentences, plain text, no lists, no emoji, no invented details. Always mention
                flights and anything early tomorrow morning, including any advice given about an early night.
              question: "{{ facts }}"
            response_variable: answer
          - if: "{{ (answer.response_text | default('') | trim) != '' }}"
            then:
              # Keep a copy that survives restarts for the bath screen (template/bath_screen.yaml)
              - event: house_briefing_written
                event_data:
                  period: morning
                  text: "{{ answer.response_text | trim }}"
              - stop: Briefing written
          - delay: "00:03:00"

- id: house_evening_briefing
  alias: House - evening briefing (local AI)
  description: >-
    19:30 daily. Tomorrow's calendar, flights in the next 36 h, tonight's low and tomorrow's
    forecast, trash night, and anything left unlocked or open, written by HA Text AI and stored in
    sensor.evening_briefing for the master bath screen.
  mode: single
  triggers:
    - trigger: time
      at: "19:30:00"
  actions:
    - action: calendar.get_events
      continue_on_error: true
      target:
        entity_id: calendar.skylight_whitehouse_family
      data:
        start_date_time: "{{ today_at() + timedelta(days=1) }}"
        end_date_time: "{{ today_at() + timedelta(days=2) }}"
      response_variable: cal
    - action: calendar.get_events
      continue_on_error: true
      target:
        entity_id: calendar.flighty
      data:
        duration:
          hours: 36
      response_variable: flights
    - action: weather.get_forecasts
      continue_on_error: true
      target:
        entity_id: weather.kmwo
      data:
        type: twice_daily
      response_variable: wx
    - variables:
        facts: >-
          {% set tomorrow = (now() + timedelta(days=1)).date() %}
          {% set ev = (cal or {}).get('calendar.skylight_whitehouse_family', {}).get('events', []) %}
          {% set fl = (flights or {}).get('calendar.flighty', {}).get('events', []) %}
          {% set fc = (wx or {}).get('weather.kmwo', {}).get('forecast', [])
             | selectattr('datetime', '>=', (now() - timedelta(hours=11)).isoformat()) | list %}
          It is {{ now().strftime('%A') }} evening. Tomorrow is {{ tomorrow.strftime('%A, %B %-d') }}.
          Outside it is {{ states('sensor.thermostat_1_outdoor_temperature') | round(0) }} degrees.
          {% for f in fc[:3] %}{{ 'Tomorrow' if f.is_daytime else 'Tonight' if loop.first else 'Tomorrow night' }}: {{ f.condition | replace('partlycloudy', 'partly cloudy') | replace('-', ' ') }}, {{ 'high' if f.is_daytime else 'low' }} {{ f.temperature }}, {{ f.precipitation_probability | default(0) }}% chance of rain. {% endfor %}
          {% if ev %}Calendar tomorrow: {% for e in ev %}{% set s = as_datetime(e.start) if 'T' in e.start else none %}{{ e.summary }}{{ ' (all day)' if s is none or s.strftime('%H:%M') == '00:00' else ' at ' ~ s.strftime('%-I:%M %p') }}; {% endfor %}{% else %}Nothing on the family calendar tomorrow.{% endif %}
          {% set first = ev | selectattr('start', 'search', 'T') | rejectattr('start', 'search', 'T00:00') | list | first %}
          {% if first and as_datetime(first.start).hour < 9 %}The first thing tomorrow is early: {{ first.summary }} at {{ as_datetime(first.start).strftime('%-I:%M %p') }}.{% endif %}
          {% for f in fl %}{% set d = as_datetime(f.start) %}Flight {{ 'tonight' if d.date() == now().date() else 'tomorrow' if d.date() == tomorrow else d.strftime('%A') }} at {{ d.strftime('%-I:%M %p') }}: {{ f.summary | replace('✈', '') | replace('​', '') | trim }}.{% if d.date() == tomorrow and d.hour < 9 %} That is an early departure, so get to bed early and pack tonight.{% endif %} {% endfor %}
          {% if states('sensor.trash_pickup') | int(-1) == 1 %}Trash pickup is tomorrow, so the bins go out tonight.{% endif %}
          {% set unlocked = ['lock.front_door', 'lock.back_door', 'lock.small_garage_door_lock', 'lock.large_garage_door_lock', 'lock.storage_room_lock'] | select('is_state', 'unlocked') | map('state_attr', 'friendly_name') | map('replace', ' Lock', '') | list %}
          {% set open_ = ['cover.small_garage_door', 'cover.large_garage_door'] | select('is_state', 'open') | map('state_attr', 'friendly_name') | list %}
          {% if unlocked %}Still unlocked: {{ unlocked | join(', ') }}.{% endif %} {% if open_ %}Still open: {{ open_ | join(', ') }}.{% endif %}
          {% if not unlocked and not open_ %}All doors are locked and the garage doors are closed.{% endif %}
          The moon is {{ states('sensor.luna_lunar_phase') | lower }}.
    # The Ollama router can answer 504 while a model loads: try up to 3 times, 3 minutes apart.
    - repeat:
        count: 3
        sequence:
          - action: ha_text_ai.ask_question
            continue_on_error: true
            data:
              instance: sensor.house_briefing
              max_tokens: 1500
              disable_thinking: true
              system_prompt: >-
                You write a calm, practical evening wind-down note for a family's bathroom screen. Use only
                the facts given. 3 to 5 short sentences, plain text, no lists, no emoji, no invented details.
                Lead with anything that needs doing tonight (bins, locks, an early start or flight), then
                tomorrow's plan and weather.
              question: "{{ facts }}"
            response_variable: answer
          - if: "{{ (answer.response_text | default('') | trim) != '' }}"
            then:
              # Keep a copy that survives restarts for the bath screen (template/bath_screen.yaml)
              - event: house_briefing_written
                event_data:
                  period: evening
                  text: "{{ answer.response_text | trim }}"
              - stop: Briefing written
          - delay: "00:03:00"

- id: driveway_vehicle_ai_description
  alias: Driveway - describe arriving vehicle (Ollama Vision)
  description: >-
    When the front driveway camera detects a vehicle, snapshot it and have Ollama Vision describe it
    (sensor.driveway_ai_description). At most once every 5 minutes.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_driveway_g6_bullet_vehicle_detected
      from: "off"
      to: "on"
  actions:
    - action: camera.snapshot
      target:
        entity_id: camera.front_driveway_g6_bullet_high_resolution_channel
      data:
        filename: /config/www/ollama_vision/driveway.jpg
    - action: ollama_vision.analyze_image
      continue_on_error: true
      data:
        image_name: Driveway
        image_url: "https://homeassistant.internal.white.fm/local/ollama_vision/driveway.jpg?t={{ now().timestamp() | int }}"
        prompt: >-
          Describe the vehicles and people in this driveway camera image in one short sentence
          (type, color, what they are doing). If there are none, say the driveway is clear.
    # Throttle: mode single drops new triggers while this runs
    - delay: "00:05:00"

- id: battery_notes_weekly_digest
  alias: Batteries - weekly low-battery digest
  description: Sunday 10:00, list devices Battery Notes marks low with the battery each needs (Matrix only).
  mode: single
  triggers:
    - trigger: time
      at: "10:00:00"
  conditions:
    - condition: time
      weekday:
        - sun
    - condition: template
      value_template: >-
        {{ states.sensor | selectattr('entity_id', 'search', '_battery_plus$')
           | selectattr('attributes.battery_low', 'eq', true) | list | count > 0 }}
  actions:
    - action: script.turn_on
      target:
        entity_id: script.matrix_homeassistant_alert
      data:
        variables:
          title: Batteries to replace
          message: >-
            {% for b in states.sensor | selectattr('entity_id', 'search', '_battery_plus$')
               | selectattr('attributes.battery_low', 'eq', true) | sort(attribute='state') -%}
            {{ b.attributes.device_name }}: {{ b.state | round(0) }}%, needs {{ b.attributes.battery_type_and_quantity }}
            {% endfor %}
