# Door contact sensors (Hue secure contact sensors, added 2026-09-23) and the Alarmo alarm.
# binary_sensor.front_door_contact / back_door_contact / garage_entry_door_contact (the house-to-garage
# door, not the overhead garage door) are also Alarmo
# sensors (armed_away + armed_home, entry/exit delay), configured in the Alarmo panel.

- id: doors_left_open
  alias: Doors - left open
  description: Phone reminder when the front, back or garage entry door stays open 10 minutes.
  mode: parallel
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
        - binary_sensor.garage_entry_door_contact
      to: "on"
      for:
        minutes: 10
  actions:
    - action: notify.mobile_app_iphone_robert
      data:
        title: "{{ trigger.to_state.name }} open"
        message: "The {{ trigger.to_state.name | lower }} has been open since {{ as_local(trigger.to_state.last_changed).strftime('%-I:%M %p') }}."
        data:
          tag: "{{ trigger.entity_id }}_open"
          url: /lovelace/home

- id: doors_opened_while_away
  alias: Doors - opened while nobody is home
  description: >-
    Phone alert with a camera snapshot when a door opens while both people are away and the alarm is
    disarmed (when armed, Alarmo handles it).
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
        - binary_sensor.garage_entry_door_contact
      from: "off"
      to: "on"
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: person.whitehouse
          state: home
    - condition: not
      conditions:
        - condition: state
          entity_id: person.emily
          state: home
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  variables:
    camera: >-
      {% set m = {
        'binary_sensor.front_door_contact': 'camera.g4_doorbell_pro_high',
        'binary_sensor.back_door_contact': 'camera.back_high',
        'binary_sensor.garage_entry_door_contact': 'camera.garage_g4_instant_high' } %}
      {{ m.get(trigger.entity_id) }}
  actions:
    - action: notify.mobile_app_iphone_robert
      data:
        title: "{{ trigger.to_state.name }} opened"
        message: "The {{ trigger.to_state.name | lower }} opened while nobody is home."
        data:
          image: "/api/camera_proxy/{{ camera }}"
          url: /lovelace/cameras
          push:
            interruption-level: time-sensitive
    - delay:
        minutes: 2

- id: doors_sensor_tamper
  alias: Doors - contact sensor tampered
  description: Phone alert when a door contact sensor's cover is removed.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_contact_tamper
        - binary_sensor.back_door_contact_tamper
        - binary_sensor.garage_entry_door_contact_tamper
      from: "off"
      to: "on"
  actions:
    - action: notify.mobile_app_iphone_robert
      data:
        title: Sensor tampered
        message: "{{ trigger.to_state.name }}"
    - delay:
        minutes: 5

- id: alarm_triggered
  alias: Alarm - triggered
  description: Critical phone alert and a house-wide announcement naming the sensor that set off Alarmo.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.alarmo
      to: triggered
  variables:
    what: >-
      {% set s = state_attr('alarm_control_panel.alarmo', 'open_sensors') or {} %}
      {{ (s.keys() | map('state_attr', 'friendly_name') | reject('none') | join(', ')) or 'a sensor' }}
  actions:
    - parallel:
        - action: notify.mobile_app_iphone_robert
          continue_on_error: true
          data:
            title: ALARM
            message: "Alarm triggered by {{ what }}."
            data:
              url: /lovelace/cameras
              push:
                sound:
                  name: default
                  critical: 1
                  volume: 1.0
                interruption-level: critical
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.family_room
            volume: 0.8
            message: "Alarm. {{ what }} opened."
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.unnamed_room_2
            volume: 0.8
            message: "Alarm. {{ what }} opened."

- id: alarm_failed_to_arm
  alias: Alarm - failed to arm
  description: Phone alert when Alarmo refuses to arm because a door is open.
  mode: single
  max_exceeded: silent
  triggers:
    - trigger: event
      event_type: alarmo_failed_to_arm
  variables:
    what: >-
      {% set s = trigger.event.data.sensors if trigger.event.data.sensors is defined else [] %}
      {{ (s | map('state_attr', 'friendly_name') | reject('none') | join(', ')) or 'an open sensor' }}
  actions:
    - action: notify.mobile_app_iphone_robert
      data:
        title: Alarm not armed
        message: "Could not arm: {{ what }} open."
        data:
          push:
            interruption-level: time-sensitive

- id: alarm_state_changed
  alias: Alarm - armed or disarmed
  description: Quiet phone notification whenever Alarmo is armed or disarmed.
  mode: queued
  triggers:
    - trigger: state
      entity_id: alarm_control_panel.alarmo
      to:
        - armed_away
        - armed_home
        - disarmed
      not_from:
        - unknown
        - unavailable
  actions:
    - action: notify.mobile_app_iphone_robert
      data:
        title: Alarm
        message: "{{ trigger.to_state.state | replace('_', ' ') | capitalize }}"
        data:
          tag: alarm_state
          push:
            interruption-level: passive

- id: doors_speaker_chime
  alias: Doors - speaker chime when opened
  description: >-
    Security-panel style announcement ("Front Door, opened") on every speaker except the Office and
    Upstairs Bathroom when the front, back or garage entry door opens. Same quiet hours as the NWS
    announcement (speaks 08:30-21:00 only). Raised from 0.30 to 0.50 on 2026-09-24 - 0.30 was too faint to hear.
    The garage entry door (180 opens/week) gets a 5-minute cooldown: each announcement starts
    timer.garage_entry_door_chime_pause, and opens while it runs stay silent.
  mode: queued
  max: 3
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
      from: "off"
      to: "on"
    - trigger: state
      id: garage_entry
      entity_id: binary_sensor.garage_entry_door_contact
      from: "off"
      to: "on"
  conditions:
    - alias: Same hours as the NWS announcement (quiet 21:00-08:30)
      condition: time
      after: "08:30:00"
      before: "21:00:00"
    - alias: Not paused (script.door_chime_pause) or in the garage entry cooldown for this door
      condition: template
      value_template: >-
        {% set t = {'binary_sensor.front_door_contact': 'timer.front_door_chime_pause',
                    'binary_sensor.back_door_contact': 'timer.back_door_chime_pause',
                    'binary_sensor.garage_entry_door_contact': 'timer.garage_entry_door_chime_pause'}[trigger.entity_id] %}
        {{ not is_state(t, 'active') }}
    - alias: Door notifications not silenced (HomeKit "Door Notifications" switch)
      condition: state
      entity_id: input_boolean.door_notifications
      state: "on"
  variables:
    label: >-
      {{ {'binary_sensor.front_door_contact': 'Front Door',
          'binary_sensor.back_door_contact': 'Back Door',
          'binary_sensor.garage_entry_door_contact': 'Garage Door'}[trigger.entity_id] }}
  actions:
    - if:
        - condition: trigger
          id: garage_entry
      then:
        - alias: Garage entry door - 5 minute announcement cooldown
          action: timer.start
          target:
            entity_id: timer.garage_entry_door_chime_pause
          data:
            duration: "00:05:00"
    - action: script.house_announce
      data:
        message: "{{ label }}, opened"
        volume: 0.50

- id: doors_please_close_announcement
  alias: Doors - "please close" announcement after 15 seconds
  description: >-
    Spoken reminder ("Please close the back door") on the house speakers (script.house_announce)
    when the front, back or garage entry door has been open 15 seconds, repeated every 30 seconds
    until it closes (capped at 20 minutes in case a sensor sticks open). Each repeat is skipped
    outside 08:30-21:00 or while input_boolean.door_notifications is off (HomeKit "Door
    Notifications" switch, auto re-enabled after 5 min). Not affected by the garage entry chime
    cooldown or script.door_chime_pause. The phone reminder at 10 minutes (doors_left_open) is unchanged.
  mode: parallel
  max: 3
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.front_door_contact
        - binary_sensor.back_door_contact
        - binary_sensor.garage_entry_door_contact
      from: "off"
      to: "on"
      for:
        seconds: 15
  variables:
    door: "{{ trigger.entity_id }}"
    label: >-
      {{ {'binary_sensor.front_door_contact': 'front door',
          'binary_sensor.back_door_contact': 'back door',
          'binary_sensor.garage_entry_door_contact': 'garage door'}[trigger.entity_id] }}
  actions:
    - repeat:
        sequence:
          - if:
              - alias: Door still open (the triggering door varies, so this is a template)
                condition: template
                value_template: "{{ is_state(door, 'on') }}"
              - alias: Speaking hours (quiet 21:00-08:30)
                condition: time
                after: "08:30:00"
                before: "21:00:00"
              - alias: Door notifications not silenced
                condition: state
                entity_id: input_boolean.door_notifications
                state: "on"
            then:
              - action: script.house_announce
                data:
                  message: "Please close the {{ label }}"
                  volume: 0.50
          - delay:
              seconds: 30
        until:
          - condition: or
            conditions:
              - alias: Door closed
                condition: template
                value_template: "{{ is_state(door, 'off') }}"
              - alias: 20 minute cap (40 x 30 s)
                condition: template
                value_template: "{{ repeat.index >= 40 }}"

- id: doors_notifications_silence_timer
  alias: Doors - silence door notifications for 5 minutes
  description: >-
    input_boolean.door_notifications is exposed to HomeKit as the "Door Notifications" switch
    ("Hey Siri, turn off the door notifications" for deliveries). Turning it off starts
    timer.door_notifications_silence (5 min, restored across restarts); when the timer finishes
    the switch turns back on. Turning it back on early cancels the timer.
  mode: queued
  triggers:
    - trigger: state
      id: silenced
      entity_id: input_boolean.door_notifications
      to: "off"
    - trigger: state
      id: unsilenced
      entity_id: input_boolean.door_notifications
      to: "on"
    - trigger: event
      id: timer_done
      event_type: timer.finished
      event_data:
        entity_id: timer.door_notifications_silence
    - trigger: homeassistant
      id: startup
      event: start
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: silenced
          sequence:
            - action: timer.start
              target:
                entity_id: timer.door_notifications_silence
              data:
                duration: "00:05:00"
        - conditions:
            - condition: trigger
              id: unsilenced
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.door_notifications_silence
        - conditions:
            - condition: trigger
              id: timer_done
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.door_notifications
        - alias: After a restart, never leave notifications off without a running timer
          conditions:
            - condition: trigger
              id: startup
            - condition: state
              entity_id: input_boolean.door_notifications
              state: "off"
            - condition: not
              conditions:
                - condition: state
                  entity_id: timer.door_notifications_silence
                  state: [active, paused]
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.door_notifications

- id: alarm_auto_arm_midnight
  alias: Alarm - auto arm (home) at midnight
  description: >-
    Arms Alarmo in Home mode at 00:00 if it is still disarmed (an Away arm is left alone). If a door is
    open Alarmo refuses and alarm_failed_to_arm sends the phone alert. Disarmed again at 08:00.
  mode: single
  triggers:
    - trigger: time
      at: "00:00:00"
  conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: disarmed
  actions:
    - action: alarm_control_panel.alarm_arm_home
      target:
        entity_id: alarm_control_panel.alarmo

- id: alarm_auto_disarm_morning
  alias: Alarm - auto disarm at 08:00
  description: >-
    Disarms Alarmo at 08:00 when it is in Home mode (the overnight arm). Away mode is left armed.
  mode: single
  triggers:
    - trigger: time
      at: "08:00:00"
  conditions:
    - condition: state
      entity_id: alarm_control_panel.alarmo
      state: armed_home
  actions:
    - action: alarm_control_panel.alarm_disarm
      target:
        entity_id: alarm_control_panel.alarmo
