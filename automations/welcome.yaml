### Welcome Home
# Rebuilt 2026-09-15. The old triggers watched device_tracker.robert_whites_iphone_ha,
# sensor.emily_iphone_zone_name1, device_tracker.brandon_farler_galaxy_s10 and
# device_tracker.samuels_iphone (iCloud3 / legacy known_devices entities that no longer exist),
# so none of them had ever fired.
#
# Presence now comes from person.whitehouse (display name "Robert"), which is linked to the
# Home Assistant Companion app tracker device_tracker.iphone_robert. For this to update in the
# background the app's iOS Location permission must be "Always" (it is currently
# "Authorized when in use").
#
# To add Emily: install the Companion app on her phone, create person.emily with her
# device_tracker, then copy the block below with !secret welcome_e.

- id: welcome_home_robby
  alias: Welcome Home Robby
  mode: single
  triggers:
    - trigger: state
      entity_id: person.whitehouse
      from: not_home
      to: home
  conditions:
    - condition: time
      after: "07:00:00"
      before: "22:30:00"
  actions:
    - action: script.sonos_say
      data:
        sonos_entity: media_player.family_room
        volume: 0.5
        message: !secret welcome_r
