# Lighting schedules for the Lutron Caséta hard-wired switches (Hue rooms are handled by the
# Hue bridge, motion sensors and the circadian_lighting switches).
# 2026-09-21: the Lutron light/fan switches are exposed as light.*/fan.* via Switch-as-X.
# Lutron entity_ids were renamed 2026-09-15 to match their names (they had drifted:
# light.dining_room_chandelier was the laundry light, switch.outside_lamp_post was the rec room).

- id: front_lights_sunset_on
  alias: Outside - front lights on at dusk
  description: Turn on the Outside Front Lights 15 minutes before sunset while the "Front lights schedule" helper is on.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:15:00"
  conditions:
    - condition: state
      entity_id: input_boolean.front_lights_schedule
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.outside_lights

- id: front_lights_late_off
  alias: Outside - front lights off at sunrise
  description: Turn off the Outside Front Lights at sunrise while the schedule helper is on (they stay on all night).
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.front_lights_schedule
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.outside_lights

- id: garage_lights_off_after_20_min
  alias: Garage - Lutron main lights off after 20 minutes
  description: >-
    The garage main lights (Lutron Caseta switch) turn off 20 minutes after being turned on. Turning them
    off and on again restarts the 20 minutes.
  mode: single
  triggers:
    - trigger: state
      entity_id: switch.garage_main_lights
      to: "on"
      for:
        minutes: 20
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.garage_main_lights

- id: gym_lights_off_after_2_hours
  alias: Gym - Lutron main lights off after 1 hour
  description: >-
    The gym (rec room) main lights are a Lutron Caseta switch with no motion sensor and were regularly
    left on all day. They turn off 1 hour after being turned on; turning them off and on again restarts
    the hour. (The 01:11 Lutron schedule shutoff still applies as well.)
  mode: single
  triggers:
    - trigger: state
      entity_id: switch.rec_room_main_lights
      to: "on"
      for:
        hours: 1
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.rec_room_main_lights

- id: master_bath_fan_timer
  alias: Master bath - fan off after 45 minutes
  description: The bath fan is a plain Lutron switch; give it a timer.
  mode: restart
  triggers:
    - trigger: state
      entity_id: fan.master_bath_fan
      to: "on"
      for:
        minutes: 45
  actions:
    - action: fan.turn_off
      target:
        entity_id: fan.master_bath_fan

- id: kitchen_undercabinet_follows_hue
  alias: Kitchen - under-cabinet lights follow Hue
  description: >-
    When the kitchen Hue lights turn on (Hue wall switch, dimmer, or app) the Lutron under-cabinet lights
    turn on; when the Hue kitchen group goes fully off they turn off. Mirrors light.kitchen_2, the Hue
    "Kitchen" room group (on if any kitchen Hue light is on).
  mode: restart
  triggers:
    - trigger: state
      entity_id: light.kitchen_2
      to: "on"
      id: hue_on
    - trigger: state
      entity_id: light.kitchen_2
      to: "off"
      id: hue_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: hue_on
          sequence:
            - action: light.turn_on
              target:
                entity_id:
                  - light.kitchen_under_cabinet_1
                  - light.kitchen_under_cabinet_2
        - conditions:
            - condition: trigger
              id: hue_off
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.kitchen_under_cabinet_1
                  - light.kitchen_under_cabinet_2

- id: master_bath_lutron_follows_hue
  alias: Master Bath - main/vanity lights follow Hue
  description: >-
    Mirror of the kitchen rule for the master bath: when a Hue master-bath downlight turns on, turn on the
    Lutron main and vanity lights; when both Hue downlights are off, turn them off. Shower light excluded.
    2026-10-11: watches the two Hue downlights instead of the light.master_bathroom room group, because the
    room group also contains the lightstrip, which master_bath_strip_follows_lights now turns on whenever any
    bath light is on (it would otherwise switch the main/vanity lights on when only the shower light was used).
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - light.hue_ambiance_downlight_4_4
        - light.hue_ambiance_downlight_5_2
      from: "off"
      to: "on"
      id: hue_on
    - trigger: state
      entity_id:
        - light.hue_ambiance_downlight_4_4
        - light.hue_ambiance_downlight_5_2
      from: "on"
      to: "off"
      id: hue_off
  actions:
    - choose:
        - conditions: [{condition: trigger, id: hue_on}]
          sequence:
            - action: light.turn_on
              target:
                entity_id: [light.master_bath_main_lights, light.master_bath_vanity_lights]
        - conditions:
            - condition: trigger
              id: hue_off
            - alias: Both Hue downlights are off
              condition: not
              conditions:
                - condition: state
                  entity_id:
                    - light.hue_ambiance_downlight_4_4
                    - light.hue_ambiance_downlight_5_2
                  state: "on"
                  match: any
          sequence:
            - action: light.turn_off
              target:
                entity_id: [light.master_bath_main_lights, light.master_bath_vanity_lights]

- id: master_bath_strip_follows_lights
  alias: Master Bath - lightstrip on (purple) whenever another bath light is on
  description: >-
    The Hue lightstrip (light.hue_lightstrip_plus_4) turns on when any other master bath light comes on (Lutron
    main / vanity / shower, Hue downlight 4, Hue shower downlight), and turns off once all of them are off.
    Purple while switch.circadian_lighting_circadian_master_bathroom_accent is off; circadian colour when it is on.
  mode: queued
  max: 10
  triggers:
    - trigger: state
      entity_id: &master_bath_lights
        - light.master_bath_main_lights
        - light.master_bath_vanity_lights
        - light.master_bath_shower_lights
        - light.hue_ambiance_downlight_4_4
        - light.hue_ambiance_downlight_5_2
      from: "off"
      to: "on"
      id: light_on
    - trigger: state
      entity_id: *master_bath_lights
      from: "on"
      to: "off"
      id: light_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: light_on
            - condition: state
              entity_id: light.hue_lightstrip_plus_4
              state: "off"
          sequence:
            - if:
                - alias: Circadian Master Bathroom Accent is on - let circadian set the colour
                  condition: state
                  entity_id: switch.circadian_lighting_circadian_master_bathroom_accent
                  state: "on"
              then:
                - action: light.turn_on
                  target:
                    entity_id: light.hue_lightstrip_plus_4
                  data:
                    transition: 1
              else:
                - action: light.turn_on
                  target:
                    entity_id: light.hue_lightstrip_plus_4
                  data:
                    hs_color: [275, 100]
                    brightness_pct: 60
                    transition: 1
        - conditions:
            - condition: trigger
              id: light_off
            - alias: All the other bath lights are off
              condition: not
              conditions:
                - condition: state
                  entity_id: *master_bath_lights
                  state: "on"
                  match: any
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.hue_lightstrip_plus_4
              data:
                transition: 1

- id: yard_lights_sunset_on
  alias: Outside - Meross yard lights on at sunset
  description: >-
    Turn on the yard lights (Meross "Deck - Smart Outdoor Plug", channel 1 "Yard Lights") at sunset.
    Also fires at HA start if it is already after sunset so a restart never leaves them dark.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.smart_switch_2206104953711657130348e1e9968c6a_outlet_1

- id: yard_lights_sunrise_off
  alias: Outside - Meross yard lights off at sunrise
  description: Turn off the Meross yard lights at sunrise (and at HA start if it is already daytime).
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: above_horizon
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.smart_switch_2206104953711657130348e1e9968c6a_outlet_1

- id: back_door_light_motion
  alias: Outside - back door light on motion after dark
  description: >-
    Turn the Back Door Light on after dark when the Backyard G5 camera sees a PERSON or an ANIMAL, or the
    back door opens, and off again 5 minutes after all of those clear. Plain pixel motion is not used:
    the upper Deck G3 Bullet (no smart detection) kept firing on a spider web, and the Under Deck camera
    fires constantly under the light. If the light was already on
    (switched on by hand or by a scene) it is left alone - only a light this automation turned on
    gets timed out, tracked by input_boolean.back_door_light_on_by_motion.
  mode: restart
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.g5_bullet_person_detected   # Backyard - G5 Bullet smart detections
        - binary_sensor.g5_bullet_animal_detected
        - binary_sensor.back_door_contact           # someone stepping out the back door
      to: "on"
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - if:
        - condition: state
          entity_id: light.back_door_light
          state: "off"
      then:
        # no brightness: this Tuya dimmer accepts but ignores remote brightness writes (stays at its
        # device minimum, bright_value 25), so it comes on at whatever level was last set at the wall
        - action: light.turn_on
          target:
            entity_id: light.back_door_light
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.back_door_light_on_by_motion
    # already on by hand or a scene: don't time it out
    - condition: state
      entity_id: input_boolean.back_door_light_on_by_motion
      state: "on"
    # mode: restart means fresh motion re-enters here and restarts the wait. "not on" rather than
    # "off" so the camera dropping to unavailable can't hold the light on forever.
    - wait_template: >-
        {{ not is_state('binary_sensor.g5_bullet_person_detected', 'on')
           and not is_state('binary_sensor.g5_bullet_animal_detected', 'on')
           and not is_state('binary_sensor.back_door_contact', 'on') }}
    - delay:
        minutes: 5
    - action: light.turn_off
      target:
        entity_id: light.back_door_light
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.back_door_light_on_by_motion

- id: back_door_light_motion_flag_reset
  alias: Outside - back door light motion flag reset
  description: Whenever the Back Door Light goes off (by anything), forget that motion turned it on.
  mode: single
  triggers:
    - trigger: state
      entity_id: light.back_door_light
      to: "off"
  actions:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.back_door_light_on_by_motion
