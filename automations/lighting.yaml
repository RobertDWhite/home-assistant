# Lighting schedules for the Lutron Caséta hard-wired switches (Hue rooms are handled by the
# Hue bridge, motion sensors and the circadian_lighting switches).
# Lutron entity_ids were renamed 2026-09-15 to match their names (they had drifted:
# light.dining_room_chandelier was the laundry light, switch.outside_lamp_post was the rec room).

- id: front_lights_sunset_on
  alias: Outside - front lights on at dusk
  description: Turn on the Outside Front Lights 15 minutes before sunset while the "Front lights schedule" helper is on.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:15:00"
  conditions:
    - condition: state
      entity_id: input_boolean.front_lights_schedule
      state: "on"
  actions:
    - action: light.turn_on
      target:
        entity_id: light.outside_lights

- id: front_lights_late_off
  alias: Outside - front lights off late
  description: Turn off the Outside Front Lights at 23:30 (and at sunrise as a backstop) while the schedule helper is on.
  mode: single
  triggers:
    - trigger: time
      at: "23:30:00"
    - trigger: sun
      event: sunrise
  conditions:
    - condition: state
      entity_id: input_boolean.front_lights_schedule
      state: "on"
  actions:
    - action: light.turn_off
      target:
        entity_id: light.outside_lights

- id: utility_lights_left_on_overnight
  alias: Lights - garage, utility and rec room off at 01:00
  description: Hard-switched work lights that get forgotten; turn them off at 01:00 if on.
  mode: single
  triggers:
    - trigger: time
      at: "01:00:00"
  actions:
    - action: switch.turn_off
      continue_on_error: true
      target:
        entity_id:
          - switch.garage_main_lights
          - switch.utility_room_main_lights
          - switch.rec_room_main_lights

- id: master_bath_fan_timer
  alias: Master bath - fan off after 45 minutes
  description: The bath fan is a plain Lutron switch; give it a timer.
  mode: restart
  triggers:
    - trigger: state
      entity_id: switch.master_bath_fan
      to: "on"
      for:
        minutes: 45
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.master_bath_fan

- id: kitchen_undercabinet_follows_hue
  alias: Kitchen - under-cabinet lights follow Hue
  description: >-
    When the kitchen Hue lights turn on (Hue wall switch, dimmer, or app) the Lutron under-cabinet lights
    turn on; when the Hue kitchen group goes fully off they turn off. Mirrors light.kitchen_2, the Hue
    "Kitchen" room group (on if any kitchen Hue light is on).
  mode: restart
  triggers:
    - trigger: state
      entity_id: light.kitchen_2
      to: "on"
      id: hue_on
    - trigger: state
      entity_id: light.kitchen_2
      to: "off"
      id: hue_off
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: hue_on
          sequence:
            - action: switch.turn_on
              target:
                entity_id:
                  - switch.kitchen_under_cabinet_1
                  - switch.kitchen_under_cabinet_2
        - conditions:
            - condition: trigger
              id: hue_off
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.kitchen_under_cabinet_1
                  - switch.kitchen_under_cabinet_2

- id: master_bath_lutron_follows_hue
  alias: Master Bath - main/vanity lights follow Hue
  description: >-
    Mirror of the kitchen rule for the master bath: when the Hue master-bath group turns on, turn on the
    Lutron main and vanity lights; when the Hue group goes fully off, turn them off. Shower light excluded.
    Flip the entity roles if you want Hue to follow Lutron instead.
  mode: restart
  triggers:
    - trigger: state
      entity_id: light.master_bathroom
      to: "on"
      id: hue_on
    - trigger: state
      entity_id: light.master_bathroom
      to: "off"
      id: hue_off
  actions:
    - choose:
        - conditions: [{condition: trigger, id: hue_on}]
          sequence:
            - action: light.turn_on
              target:
                entity_id: [light.master_bath_main_lights, light.master_bath_vanity_lights]
        - conditions: [{condition: trigger, id: hue_off}]
          sequence:
            - action: light.turn_off
              target:
                entity_id: [light.master_bath_main_lights, light.master_bath_vanity_lights]

- id: yard_lights_sunset_on
  alias: Outside - Meross yard lights on at sunset
  description: >-
    Turn on the yard lights (Meross "Deck - Smart Outdoor Plug", channel 1 "Yard Lights") at sunset.
    Also fires at HA start if it is already after sunset so a restart never leaves them dark.
  mode: single
  triggers:
    - trigger: sun
      event: sunset
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.smart_switch_2206104953711657130348e1e9968c6a_outlet_1

- id: yard_lights_sunrise_off
  alias: Outside - Meross yard lights off at sunrise
  description: Turn off the Meross yard lights at sunrise (and at HA start if it is already daytime).
  mode: single
  triggers:
    - trigger: sun
      event: sunrise
    - trigger: homeassistant
      event: start
  conditions:
    - condition: state
      entity_id: sun.sun
      state: above_horizon
  actions:
    - action: switch.turn_off
      target:
        entity_id: switch.smart_switch_2206104953711657130348e1e9968c6a_outlet_1
