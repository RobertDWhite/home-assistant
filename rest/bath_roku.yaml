# Raw Roku ECP calls for the master bath Roku. The Roku's "Control by mobile apps" must be
# Permissive.
bath_roku_keypress:
  url: "http://10.100.22.10:8060/keypress/{{ key }}"
  method: POST
  timeout: 10

# Launch (or re-target, if already running) the sideloaded screen channel: content "live" plays
# the dashboard stream, "blank" a looping black clip.
bath_roku_screen:
  url: "http://10.100.22.10:8060/launch/dev?contentId={{ content }}"
  method: POST
  timeout: 10
