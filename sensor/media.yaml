### MEDIA #############################################

# Sensor to monitor Plex Server for added Movies
  - platform: plex_recently_added
    name: Recently Added Movies
    token: !secret plex_token
    host: !secret host_plex_synology   # Plex moved from Unraid to the Synology
    port: 32400
    section_types:
    - movie

# Sensor to monitor Plex Server for added TV_Shows
  - platform: plex_recently_added
    name: Recently Added TV
    token: !secret plex_token
    host: !secret host_plex_synology   # Plex moved from Unraid to the Synology
    port: 32400
    section_types:
    - show

# The two *_upcoming_media custom components that used to live here are no longer installed
# (startup error "Integration not found"); their apps are configured as UI integrations now.
