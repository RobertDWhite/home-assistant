### ENVIRONMENT ####################################################

# Mold indicator from the Trane/Nexia thermostat readings (the old config pointed at
# sensor.main_temperature/humidity and the long-dead Dark Sky outdoor temperature).
  - platform: mold_indicator
    indoor_temp_sensor: sensor.thermostat_1_nativezone_temperature
    indoor_humidity_sensor: sensor.thermostat_1_relative_humidity
    outdoor_temp_sensor: sensor.thermostat_1_outdoor_temperature
    calibration_factor: 2.0
