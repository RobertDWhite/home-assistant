# Master bath screen: the Roku plays a live video stream of the "Screen" dashboard (ha-screen),
# rendered in the cluster (whitehouse-rke2 apps/home/ha-screen). Roku dropped the "Play on Roku"
# channel HA used for URLs, so a small sideloaded channel ("dev", apps/home/ha-screen/roku-channel)
# plays the stream. Needs developer mode and "Control by mobile apps" set to Permissive.
bath_screen_show:
  alias: Bath screen - show
  description: Play the dashboard stream on the master bath Roku.
  icon: mdi:television-play
  mode: single
  max_exceeded: silent
  sequence:
    - action: media_player.play_media
      target:
        entity_id: media_player.master_bath_roku
      data:
        media_content_type: app
        media_content_id: dev

bath_screen_hide:
  alias: Bath screen - hide
  description: Go back to the Roku home screen and turn the TV off, but only if the screen channel is what's showing.
  icon: mdi:television-off
  mode: single
  max_exceeded: silent
  sequence:
    # Only when the screen channel ("dev") is up; leave anything else someone is watching alone.
    - condition: state
      entity_id: media_player.master_bath_roku
      attribute: app_id
      state: dev
    - action: remote.send_command
      continue_on_error: true
      target:
        entity_id: remote.master_bath_roku
      data:
        command: home
    # A Streaming Stick can't power itself down (it would sit on the Roku City screensaver with
    # the TV lit); PowerOff asks it to put the TV in standby over HDMI-CEC.
    - delay: "00:00:02"
    - action: rest_command.bath_roku_keypress
      continue_on_error: true
      data:
        key: PowerOff
