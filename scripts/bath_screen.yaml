# Shared controller cancels pending startup on shutdown. IR power commands are discrete.
bath_screen_power:
  alias: Bath screen - power controller
  mode: restart
  fields:
    power:
      required: true
      selector:
        boolean: null
  sequence:
  - choose:
    - conditions: '{{ power | bool }}'
      sequence:
      - action: media_player.turn_on
        target:
          entity_id: media_player.samsung_tv
      - delay: 00:00:05
      - action: rest_command.bath_roku_screen
        data:
          content: live
    default:
    - repeat:
        count: 2
        sequence:
        - action: media_player.turn_off
          target:
            entity_id: media_player.samsung_tv
        - delay: 00:00:01
    - if:
      - condition: state
        entity_id: media_player.master_bath_roku
        attribute: app_id
        state: dev
      then:
      - action: rest_command.bath_roku_screen
        data:
          content: blank
bath_screen_show:
  alias: Bath screen - show
  mode: restart
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.master_bath_tv
bath_screen_hide:
  alias: Bath screen - hide
  mode: restart
  sequence:
  - action: switch.turn_off
    target:
      entity_id: switch.master_bath_tv
