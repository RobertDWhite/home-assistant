great_room_feed_play:
  alias: Great Room feed controller
  mode: restart
  fields:
    url:
      required: true
      selector:
        text: {}
    title:
      required: true
      selector:
        text: {}
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.xbr_65a8g
    data:
      media_content_id: '{{ url }}'
      media_content_type: application/vnd.apple.mpegurl
      extra:
        title: '{{ title }}'
        stream_type: LIVE
great_room_summary_feed:
  alias: Great Room Summary Feed
  mode: restart
  icon: mdi:television-play
  sequence:
  - action: script.great_room_feed_play
    data:
      url: http://10.99.5.60/stream.m3u8
      title: Summary Feed
