master_bathroom_feed_play:
  alias: Master Bathroom feed controller
  mode: restart
  fields:
    url:
      required: true
      selector:
        text: {}
    title:
      required: true
      selector:
        text: {}
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.master_bath_tv
  - condition: state
    entity_id: switch.master_bath_tv
    state: 'on'
  - action: rest_command.bath_roku_screen
    data:
      content: '{{ url | urlencode }}'
