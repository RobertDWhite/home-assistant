# Short house-wide announcement (door chimes and similar), fired on every speaker at the same time.
#
# Deliberately skips the Office Sonos (media_player.unnamed_room) and the Upstairs Bathroom
# Sonos (media_player.living_room_speaker).
#   - Sonos: announce overlay via script.sonos_say, so music ducks and resumes.
#   - HomePods / WiiMs: Google TTS, only when the speaker is NOT playing (their TTS stops the music).
#   - Theatre Denon: only when it is already on, at its current volume.
house_announce:
  alias: House announcement (all speakers except Office and Upstairs Bathroom)
  mode: parallel
  fields:
    message:
      description: Text to speak
      example: Front Door, opened
    volume:
      description: Announcement volume, 0-1
      example: 0.45
  variables:
    vol: "{{ volume | default(0.45, true) | float(0.45) }}"
  sequence:
    - parallel:
        # Great Room Sonos
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.family_room
            volume: "{{ vol }}"
            message: "{{ message }}"
        # Dining Room Sonos
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.dining_room
            volume: "{{ vol }}"
            message: "{{ message }}"
        # Main Bedroom Sonos
        - action: script.sonos_say
          continue_on_error: true
          data:
            sonos_entity: media_player.unnamed_room_2
            volume: "{{ vol }}"
            message: "{{ message }}"
        # Kitchen HomePod
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.kitchen
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.kitchen
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.kitchen
                message: "{{ message }}"
        # Play Room HomePod
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.play_room
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.play_room
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.play_room
                message: "{{ message }}"
        # Bedroom HomePod
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.bedroom
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.bedroom
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.bedroom
                message: "{{ message }}"
        # Backyard WiiM
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.backyard_2
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.backyard_2
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.backyard_2
                message: "{{ message }}"
        # Gym WiiM
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.gym_2
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.gym_2
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.gym_2
                message: "{{ message }}"
        # Garage WiiM
        - if:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.garage_2
                  state: [playing, unavailable, unknown]
          then:
            - action: media_player.volume_set
              continue_on_error: true
              target:
                entity_id: media_player.garage_2
              data:
                volume_level: "{{ vol }}"
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.garage_2
                message: "{{ message }}"
        # Theatre Denon, only when already on
        - if:
            - condition: state
              entity_id: media_player.denon_avr_x4700h
              state: "on"
          then:
            - action: tts.google_translate_say
              continue_on_error: true
              data:
                entity_id: media_player.denon_avr_x4700h
                message: "{{ message }}"
