## Script used in conjunction with automations/weather_alerts.yaml and sensor/weather.yaml

nws_popup_on_wx_alert:
  alias: NWS Weather Alert Pop Up
  mode: queued
  sequence:
    # Dismiss any current alert so the UI is not filled with old alerts.
    - action: persistent_notification.dismiss
      data:
        notification_id: "nwswxalert"
    # Only show a popup for an alarm-worthy alert (see custom_templates/nws_alerts.jinja).
    - variables:
        alarms: >-
          {% from 'nws_alerts.jinja' import alarm_features %}
          {{ alarm_features(state_attr('sensor.nws_alert_event', 'features')) }}
    - condition: template
      value_template: "{{ alarms | count > 0 }}"
    - action: persistent_notification.create
      data:
        notification_id: "nwswxalert"
        title: "{{ alarms[0].properties.event }}"
        message: "{{ alarms[0].properties.description }}"
