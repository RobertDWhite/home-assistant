# Clean date sensors for the Anniversaries integration (its `date` attribute is a full
# timestamp, which the dashboard would render as 'November 5, 1994 at 12:00:00 AM').
# One per anniversary: state = 'Month D, YYYY', attribute countdown = '45 Days'.
# Regenerate when anniversaries are added (dashboards/gen_dashboard.py lists them).

  - sensor:
      - name: "Annie's Birthday date"
        unique_id: anniversary_annie_s_birthday_date
        state: "{{ as_datetime(state_attr('sensor.anniversary_annie_s_birthday', 'date')).strftime('%B %-d, %Y') if state_attr('sensor.anniversary_annie_s_birthday', 'date') else 'unknown' }}"
        icon: "{{ 'mdi:candle' if 'memorial' in 'sensor.anniversary_annie_s_birthday' else 'mdi:cake-variant' }}"
        availability: "{{ has_value('sensor.anniversary_annie_s_birthday') }}"
        attributes:
          countdown: "{{ states('sensor.anniversary_annie_s_birthday') }} {{ state_attr('sensor.anniversary_annie_s_birthday', 'unit_of_measurement') }}"
          years: "{{ state_attr('sensor.anniversary_annie_s_birthday', 'years_at_anniversary') }}"
          source: sensor.anniversary_annie_s_birthday
