# camera: the generic radar/space-weather cameras and the local_file Facebox camera are UI
# config entries now; the YAML platforms were ignored ("does not support platform setup").

circadian_lighting:
  interval: 600
  max_colortemp: 6500
  min_colortemp: 2000
  
circadian_lighting_bridge:

device_tracker:
  - platform: icloud3
    username: !secret icloud_un
    password: !secret icloud_password
    track_devices:
      - !secret icloud_1
      - !secret icloud_2
      - !secret icloud_3
      - !secret icloud_4
      - !secret icloud_5
      - !secret icloud_6
      - !secret icloud_7
      - !secret icloud_9
      - !secret icloud_10
    tracking_method: fmf

  - platform: aprs
    username: W3RDW  # or FO0BAR-1 to FO0BAR-15
    callsigns:
      - 'W3RDW*'
      - 'KE8WSC*'
      - 'WB8AM*'
      - 'KF8BPW*'
      - 'N8CMB*'
      - 'W8ITE*'
      
homekit:
  safe_mode: false
  filter:
   exclude_domains:
     - light
     - device_tracker
     - sensor
     - media_player
     - device_automation
     - geo_location   # ADS-B aircraft + GDACS events; thousands of entities, HomeKit caps at 150
     - scene          # 204 Hue scenes: Hue is paired to HomeKit natively and exposes its own scenes
     - event          # Hue button / Protect / backup events; HomeKit maps almost none of these
     - automation     # 34 automations were being bridged as on/off switches
     - select         # 11 select entities (device option pickers) were being bridged
   # Protect, FAA, Xbox, WiiM, SmartTub, Lutron entities live in homekit_exclude.yaml (generated)
   exclude_entities: !include homekit_exclude.yaml
   exclude_entity_globs:
     - binary_sensor.*_occupancy
     # UniFi Protect cameras stay OUT of HomeKit (they go via Scrypted); Protect names every
     # channel *_high/_medium/_low or *_resolution_channel, so these globs catch current and
     # future Protect cameras while leaving the generic weather/radar/space cameras exposed.
     - camera.*_high
     - camera.*_high_[0-9]*
     - camera.*_medium
     - camera.*_medium_[0-9]*
     - camera.*_low
     - camera.*_low_[0-9]*
     - camera.*_resolution_channel
     - camera.*_resolution_channel_[0-9]*
     - camera.*_package_camera
     - camera.*_insecure

influxdb:
  host: !secret host_influx
  port: 443
  ssl: true
  api_version: 2
  organization: !secret influx_org
  bucket: homeassistant
  token: !secret influx_token
  tags:
    source: HA


ios:

sonos_cloud:
  client_id: !secret sonos_dev_client
  client_secret: !secret sonos_dev_secret
# https://github.com/jjlawren/sonos_cloud/blob/main/README.md

# Weather: NWS (station KMWO) is configured as a UI integration -> weather.kmwo.
# 2026-09-15 cleanup: removed YAML for discovery, map, panel_iframe (all removed from HA core),
# duckdns/hue/plex (UI-only integrations; YAML was ignored with errors), aurora and facebox
# (platforms no longer exist). The ADS-B map link moved to the Aviation dashboard view.
