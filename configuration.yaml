# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:
#---------------------------------------------------------------------------------------------------#
#---------------------------------------------------------------------------------------------------#
#---------------------------------------------------------------------------------------------------#

homeassistant:
  # Location required to calculate the time the sun rises and sets
  latitude: !secret latitude_sec
  longitude: !secret longitude_sec
  # Impacts weather/sunrise data, majorly important for circadian_lighting (altitude above sea level in meters)
  elevation: !secret elevation_sec
  # metric for Metric, imperial for Imperial
  unit_system: imperial
  # http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: America/New_York
  #allowlist_external_dirs:
  #  - /documentaries
  #  - /movies
  #  - /tv_shows

#---------------------------------------------------------------------------------------------------#
#---------------------------------------------------------------------------------------------------#
#---------------------------------------------------------------------------------------------------#

automation: !include_dir_merge_list automations/
group: !include groups.yaml
light: !include lights.yaml
notify: !include notify.yaml
rest_command: !include_dir_merge_named rest/
script: !include_dir_merge_named scripts/
sensor: !include_dir_merge_list sensor/
switch: !include_dir_merge_list switch/
template: !include_dir_merge_list template/
zone: !include zone.yaml

# Recorder: the world clocks change state every minute; their history is noise, so they are not
# recorded at all (tiles still show the live time). Existing rows were purged 2026-09-16.
recorder:
  exclude:
    entities:
      - sensor.asia_jerusalem
      - sensor.europe_london
      - sensor.australia_sydney
      - sensor.asia_tokyo
      - sensor.america_new_york
      - sensor.america_chicago
      - sensor.america_denver
      - sensor.america_phoenix
      - sensor.america_los_angeles
      - sensor.atlantic_reykjavik

# Matrix: dedicated bot @homeassistant:white.fm on the house Synapse; joins the "Home Assistant" room.
# Gives notify.matrix plus matrix_command events for chat-driven automations. Credentials in secrets.yaml.
matrix:
  homeserver: https://matrix.internal.white.fm
  username: !secret matrix_ha_user
  password: !secret matrix_ha_password
  rooms:
    - !secret matrix_ha_room

# iTunes / Apple Music on the Mac mini via the itunes-api helper (https://github.com/maddox/itunes-api,
# `npm install -g itunes-api && itunes-api`, listens on 8181). YAML-only integration; needs a restart.
media_player:
  - platform: itunes
    host: !secret host_mac_itunes
    port: 8181


###SYSTEM##################################################################################

# Allows you to issue voice commands from the frontend in enabled browsers
conversation:

frontend:
# Add themes
  themes: !include themes.yaml

gdacs:
  categories:
    - Drought
    - Earthquake
    - Flood
    - Tropical Cyclone
    - Tsunami
    - Volcano
  radius: 1000
  latitude: !secret latitude_sec
  longitude: !secret longitude_sec

geo_location:
  - platform: adsb_tar1090
    url: https://adsb.internal.w3rdw.radio/data/aircraft.json   # http 301s to https; takes effect on restart

  - platform: usgs_earthquakes_feed
    entity_namespace: 'usgs_earthquakes_service_feed'
    feed_type: 'past_month_all_earthquakes'
    radius: 100
    minimum_magnitude: 0.0
  - platform: nsw_rural_fire_service_feed
    entity_namespace: 'nsw_fire_service_feed'
    radius: 100

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - !secret host_nginx_proxy
    - 10.42.0.0/16
    - 10.43.0.0/16
    - 10.99.5.0/24
    - 10.100.0.0/16

# View all events in a logbook
logbook:

logger:
  default: warning
  logs:
    # 2026-09-15 noise control (see system_log counts in the review):
    linkplay: error                      # "Server disconnected" ~28k/wk from the WiiM speakers' HTTPS polling
    pywiim: critical                     # stale WiiM entry removed; residual UPnP timeouts
    roombapy: critical                   # both Roombas need re-pairing (bad password); entries disabled
    pychromecast.socket_client: critical # Sony TVs powered off = "Failed to connect ... retrying" every 5s
    homeassistant.helpers.sun: error     # get_astral_location deprecation from circadian_lighting
    aio_georss_client: error             # GDACS feed transient timeouts
    aio_geojson_client: error            # USGS feed transient timeouts
    custom_components.adsb_tar1090: warning
    nio.responses: error                 # matrix-nio schema warnings on every sync ('next_batch' missing)
    custom_components.kubernetes.kubernetes_client: error  # 429s from API priority & fairness on the read-only SA

# Track the sun
sun:

system_health:

system_log:
  fire_event: true
  
# Text to speech
tts:
- platform: google_translate

zeroconf:

