# Adding support for Discord notifications via The Best Server (Channel ID: saved in secrets)
  - platform: discord
    token: !secret discord_token
    name: discord

# Adding support for notifications to the Ecobee
  - name: ecobee_main
    platform: ecobee

# Add support for Chrome/Firefox notifications
  - platform: html5
    name: Chrome_Notifications
    vapid_pub_key: !secret google_html5_proj_pub_key
    vapid_prv_key: !secret google_html5_proj_priv_key
    vapid_email: !secret google_email

  - name: matrix_media
    platform: rest
    method: POST
    verify_ssl: true
    content_type:  'application/json'
    resource: !secret matrix_hook_media
    
  - name: matrixsmarthome
    platform: rest
    method: POST
    verify_ssl: true
    content_type:  'application/json'
    resource: !secret matrix_hook_smarthome

# Encrypted Home Assistant room via Hookshot; the webhook URL stays in secrets.yaml.
  - name: matrix
    platform: rest
    method: POST_JSON
    verify_ssl: true
    resource: !secret matrix_hook_homeassistant_e2ee
    message_param_name: message
    title_param_name: title

# Email via the in-cluster postfix relay (whitehouse-rke2 apps/misc/postfix, LoadBalancer postfix-lb
# 10.99.5.127:25, netpol allows only this HA VM). The relay authenticates to Proton as
# server@whitematter.tech and Proton rejects any other sender, so the sender MUST stay that address.
# Relay cert is self-signed (cert-manager selfsigned issuer) -> STARTTLS without verification.
# A local "250 queued" means nothing; confirm delivery in the postfix log (status=sent).
  - name: email
    platform: smtp
    server: 10.99.5.127
    port: 25
    timeout: 15
    encryption: starttls
    verify_ssl: false
    sender: server@whitematter.tech
    sender_name: Home Assistant
    recipient: !secret smtp_recipient
